name: Cleanup Preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Cleanup Preview Resources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Delete Neon branch
        id: neon-cleanup
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Delete Electric Fly.io app
        id: electric-cleanup
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps destroy "superset-electric-pr-${{ github.event.pull_request.number }}" --yes

      - name: Update comment
        if: always()
        # thollander/actions-comment-pull-request@v3 runs on Node 20, which
        # GitHub removed from all runners in Sep 2026, and it has no node24
        # release. Replaced with the equivalent upsert via github-script.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = '🚀-preview-deployment';
            const marker = `<!-- ${tag} -->`;
            const dbStatus = '${{ steps.neon-cleanup.outcome }}' === 'success' ? '✅' : '⚠️';
            const elStatus = '${{ steps.electric-cleanup.outcome }}' === 'success' ? '✅' : '⚠️';
            const body = [
              '## 🧹 Preview Cleanup Complete',
              '',
              'The following preview resources have been cleaned up:',
              `- ${dbStatus} Neon database branch`,
              `- ${elStatus} Electric Fly.io app`,
              '',
              'Thank you for your contribution! 🎉',
              '',
              marker,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
